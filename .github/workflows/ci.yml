name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

      - name: cargo test
        run: cargo test --target x86_64-unknown-linux-gnu

      # NOTE: a musl target (x86_64-unknown-linux-musl) was considered
      # for a fully static build, but skipped here to keep this workflow
      # simple/low-risk -- the project has no known musl-incompatible
      # dependencies, but adding and verifying a second target wasn't
      # worth the extra CI complexity for this initial release. Revisit
      # if a statically-linked release artifact becomes a goal.
